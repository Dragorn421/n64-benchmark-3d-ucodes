name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install N64 toolchain
      run: |
        curl -L -o gcc-toolchain-mips64-x86_64.deb https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
        sudo apt-get install build-essential
        sudo dpkg -i gcc-toolchain-mips64-x86_64.deb

    - name: Download and extract Blender
      run: |
        curl -o blender-4.5.9-linux-x64.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz
        tar -xJvf blender-4.5.9-linux-x64.tar.xz

    - name: Install simple_common_materials
      run: |
        blender-4.5.9-linux-x64/blender --command extension build --source-dir assets/simple_common_materials --output-filepath simple_common_materials.zip
        blender-4.5.9-linux-x64/blender --command extension install-file --repo user_default --enable simple_common_materials.zip

    - name: Download and install DragEx
      run: |
        curl -L -o dragex-cp311-manylinux_x86_64-v0.0.1.zip https://github.com/Dragorn421/DragEx/releases/download/v0.0.1/dragex-cp311-manylinux_x86_64-v0.0.1.zip
        blender-4.5.9-linux-x64/blender --command extension install-file --repo user_default --enable dragex-cp311-manylinux_x86_64-v0.0.1.zip

    - name: Build
      run: N64_GCCPREFIX=/opt/libdragon BLENDER_4_5=$(realpath blender-4.5.9-linux-x64/blender) ./buildall.sh

    - name: Upload benchmark3d_f3dex2.z64
      uses: actions/upload-artifact@v7
      with:
        name: benchmark3d_f3dex2.z64
        path: f3dex2/benchmark3d_f3dex2.z64
